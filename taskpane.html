<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Copy from another workbook</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js"></script>

  <style>
    body { font-family: Segoe UI, Arial; padding: 12px; }
    label { display:block; margin-top: 10px; font-size: 12px; color:#444; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 12px; }
    #status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>

<body>
  <h3>Copy from another workbook</h3>

  <label>Sharing link (SharePoint/OneDrive)</label>
  <input id="fileUrl" placeholder="Paste sharing link to the .xlsx file" />

  <label>Worksheet name (tab)</label>
  <input id="sheetName" placeholder="e.g. Sheet1 / Data / Input" />

  <button id="copyBtn">Kopiuj</button>
  <div id="status"></div>

  <script src="taskpane.js"></script>
</body>
</html>
